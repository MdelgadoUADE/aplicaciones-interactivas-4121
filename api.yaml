openapi: 3.0.3
info:
  title: API de tienda de libros MaxiLibros
  description: >
    API para la gestión de venta de libros. Alineada al DER con
    producto_categoria (N:N), producto_imagen (múltiples imágenes) y
    estados en español.
  version: 2.0.0

servers:
  - url: http://localhost:3000/api
    description: Servidor principal

tags:
  - name: Identificadores
    description: Utilidades para obtener IDs de productos
  - name: Productos
    description: Gestión del catálogo de productos
  - name: Categorías
    description: Gestión de categorías
  - name: Autenticación
    description: Registro y login de usuarios
  - name: Comercio
    description: Información institucional del comercio
  - name: Consultas
    description: Formulario de contacto y gestión de consultas

paths:
  /products/get-ids:
    get:
      summary: Trae los IDs de productos disponibles, ordenados de menor a mayor
      description: >
        Endpoint de utilidad para sincronizar listas en el frontend sin
        descargar el catálogo completo.
      tags:
        - Identificadores
      parameters:
        - name: limit
          in: query
          required: false
          description: Límite de cuántos IDs traer. Por defecto trae 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: categoryId
          in: query
          required: false
          description: Filtra los IDs por categoría
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Cantidad de IDs a saltar (para paginar)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: IDs obtenidos correctamente (la lista puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
              example: [1, 2, 3]

  /products:
    get:
      summary: Obtener lista de productos (info básica para armar cards)
      description: >
        Sitio público sin token: devuelve solo productos con estado=activo,
        ignorando cualquier otro valor de 'estado' recibido. Panel admin con
        token válido y rol admin: respeta el filtro 'estado' tal como se
        envía (incluyendo la posibilidad de ver 'inactivo' o 'agotado').
        El servidor decide esto según la autenticación, nunca según lo que
        el cliente declare.
      tags:
        - Productos
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: categoryId
          in: query
          required: false
          description: >
            Filtra productos que tengan asignada esta categoría (relación
            muchos a muchos vía producto_categoria).
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: Buscar por nombre o descripción
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: inStock
          in: query
          required: false
          description: Solo productos con stock disponible
          schema:
            type: boolean
        - name: estado
          in: query
          required: false
          description: >
            Filtra por estado. Si el solicitante no está autenticado como
            admin, el servidor ignora cualquier valor distinto de 'activo'
            y fuerza ese filtro.
          schema:
            $ref: "#/components/schemas/ProductoEstado"
        - name: tipoProducto
          in: query
          required: false
          description: >
            Filtra por tipo de producto. Actualmente solo 'libro' tiene
            tabla de especialización implementada (ver schema Libro).
          schema:
            $ref: "#/components/schemas/TipoProducto"
        - name: onSale
          in: query
          required: false
          description: Si es true, devuelve solo productos con descuento > 0
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [price_asc, price_desc, title_asc, newest]
            default: newest
      responses:
        "200":
          description: Lista paginada de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductCard"
    post:
      summary: Crear un nuevo producto
      description: >
        Requiere rol admin. Debe incluir al menos una categoría
        (producto_categoria no permite productos sin categoría) y, si
        tipoProducto es 'libro', los datos de la tabla libro (isbn único).
        Se recomienda ejecutar la creación del producto y sus tablas
        relacionadas (libro, categorías, imágenes) dentro de una única
        transacción de base de datos.
      tags:
        - Productos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe un producto con ese ISBN (si tipoProducto=libro)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products/{id}:
    get:
      summary: Obtener el detalle completo de un producto
      description: >
        Si el producto tiene estado=inactivo y quien solicita no es admin
        autenticado, el servidor debe responder 404 (no filtrar su existencia).
      security:
        - bearerAuth: []
        - {}
      tags:
        - Productos
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Reemplazar completamente un producto
      description: >
        Requiere rol admin. Todos los campos del input son obligatorios,
        incluyendo el array completo de categorías (reemplaza las
        asignaciones existentes en producto_categoria).
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Actualizar campos específicos de un producto
      description: >
        Requiere rol admin. Útil para cambiar solo el stock o el precio
        sin enviar el objeto completo. Si se envía categoryIds, reemplaza
        el set completo de categorías (no hace un merge parcial).
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatchInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Eliminar un producto
      description: >
        Requiere rol admin. Elimina en cascada (o vía transacción manual)
        sus filas asociadas en libro, producto_categoria y producto_imagen.
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "204":
          description: Producto eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/status:
    patch:
      summary: Activar, desactivar o marcar como agotado un producto
      description: >
        Requiere rol admin. Cambia únicamente el campo estado, como
        operación explícita e independiente del PATCH genérico.
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductStatusUpdate"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/images:
    get:
      summary: Listar las imágenes de un producto
      tags:
        - Productos
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "200":
          description: Imágenes del producto, ordenadas por el campo orden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductImage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Agregar una imagen a un producto
      description: >
        Requiere rol admin. Si esPrincipal=true, el backend debe
        desmarcar cualquier otra imagen principal del mismo producto
        (hay un índice único parcial en la base que solo permite una
        imagen principal por producto).
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageInput"
      responses:
        "201":
          description: Imagen agregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/images/{imageId}:
    delete:
      summary: Eliminar una imagen de un producto
      description: Requiere rol admin.
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Imagen eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      summary: Obtener lista de categorías
      tags:
        - Categorías
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      summary: Crear una categoría
      description: Requiere rol admin. El nombre debe ser único.
      tags:
        - Categorías
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe una categoría con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}:
    get:
      summary: Obtener una categoría
      tags:
        - Categorías
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      responses:
        "200":
          description: Detalle de la categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar una categoría
      description: Requiere rol admin.
      tags:
        - Categorías
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Eliminar una categoría
      description: >
        Requiere rol admin. Falla si algún producto quedaría sin ninguna
        categoría como resultado (regla de negocio: todo producto debe
        tener al menos una categoría).
      tags:
        - Categorías
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      responses:
        "204":
          description: Categoría eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Al menos un producto quedaría sin categorías si se elimina esta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}/products:
    get:
      summary: Obtener los productos de una categoría
      tags:
        - Categorías
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Lista paginada de productos de la categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductCard"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/register:
    post:
      summary: Registrar un nuevo usuario
      description: >
        No se permiten emails duplicados. El rol se asigna siempre como
        'cliente' en el backend; este input no acepta 'rol' del cliente
        (ver nota de seguridad en RegisterInput sobre mass assignment).
        Importante: la tabla usuarios tiene DEFAULT 'admin' en la columna
        rol a nivel de base de datos — el backend NUNCA debe confiar en
        ese default y debe asignar 'cliente' explícitamente en cada INSERT
        de registro público.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Usuario registrado. Devuelve token y datos del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Iniciar sesión
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: Cerrar sesión
      description: >
        Agrega el jti del token actual a token_revocado para invalidarlo
        antes de su expiración natural.
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      summary: Solicitar recuperación de contraseña
      description: >
        Público. Genera una fila en password_reset_token con estado
        'vigente' y envía un email con el token en texto plano (el
        token_hash es lo único que se persiste). Por seguridad, responde
        200 aunque el email no exista, para no filtrar qué correos están
        registrados.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: >
            Si el email existe, se envió un correo con instrucciones.
            La respuesta es la misma exista o no la cuenta.
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/reset-password:
    post:
      summary: Restablecer la contraseña usando el token recibido por email
      description: >
        Busca el token por su hash, valida que su estado sea 'vigente' y
        que fecha_expiracion no haya pasado. Al usarlo exitosamente, pasa
        su estado a 'usado'.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Contraseña actualizada correctamente
        "400":
          description: >
            Token inválido, con estado distinto de 'vigente', expirado, o
            contraseña que no cumple los requisitos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      summary: Obtener el perfil del usuario autenticado
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos del usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Modificar los datos personales del usuario autenticado
      description: >
        El usuario a modificar es siempre el que surge del token (id del
        JWT verificado), nunca un id recibido en el body o en la URL. No
        existe un endpoint para que un usuario modifique a otro por id
        (evita IDOR / Broken Object Level Authorization).
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Datos actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /comercio:
    get:
      summary: Obtener la información institucional del comercio
      description: >
        Público. Devuelve un único registro (singleton): el comercio
        asociado a esta instancia de la aplicación, con sus redes sociales.
      tags:
        - Comercio
      responses:
        "200":
          description: Información del comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comercio"
        "404":
          description: Todavía no se cargó la información del comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Crear o actualizar la información institucional del comercio
      description: >
        Requiere rol admin. Al ser un singleton, PUT crea el registro si
        no existe o lo reemplaza si ya existe. El array redesSociales
        reemplaza completamente las filas existentes en red_social
        (borrar todas e insertar las nuevas dentro de una transacción).
      tags:
        - Comercio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComercioInput"
      responses:
        "200":
          description: Información del comercio actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comercio"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /consultas:
    post:
      summary: Enviar una consulta desde el formulario de contacto
      description: Endpoint público, no requiere autenticación. Cualquier visitante puede enviar una consulta.
      tags:
        - Consultas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaInput"
      responses:
        "201":
          description: Consulta creada correctamente, con estado='pendiente'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "400":
          $ref: "#/components/responses/ValidationError"

    get:
      summary: Listar consultas recibidas
      description: Solo admin. Permite filtrar por estado.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConsultaStatus"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Lista paginada de consultas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedConsulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /consultas/{id}:
    get:
      summary: Obtener el detalle de una consulta
      description: Solo admin.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      responses:
        "200":
          description: Detalle de la consulta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Eliminar una consulta
      description: Solo admin.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      responses:
        "204":
          description: Consulta eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /consultas/{id}/estado:
    patch:
      summary: Cambiar el estado de una consulta
      description: >
        Solo admin. Estados posibles según el DER actual: pendiente,
        respondida, cerrada.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaStatusUpdate"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Header Authorization: Bearer <token>. El middleware debe validar
        el token, chequear que su jti no esté en token_revocado, y en
        cada rama (sin token, token inválido, token expirado, token
        revocado) cortar la ejecución con 'return' antes de llamar a
        next() — un return faltante deja el request en un estado
        inconsistente.

  parameters:
    PathProductId:
      name: id
      in: path
      required: true
      description: ID del producto
      schema:
        type: integer
        minimum: 1
    PathCategoryId:
      name: id
      in: path
      required: true
      description: ID de la categoría
      schema:
        type: integer
        minimum: 1
    PathConsultaId:
      name: id
      in: path
      required: true
      description: ID de la consulta
      schema:
        type: integer
      example: 1
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Recurso no encontrado
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: El campo precio debe ser mayor o igual a 0
    Unauthorized:
      description: No autenticado (token ausente, inválido, expirado o revocado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Token inválido o expirado
    Forbidden:
      description: No tienes permisos para esta operación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Se requiere rol admin

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Mensaje descriptivo del error

    TipoProducto:
      type: string
      enum: [libro, papeleria, accesorio, otros]
      description: >
        Solo 'libro' tiene hoy una tabla de especialización implementada
        (ver schema Libro). Los demás valores existen a nivel de base de
        datos (CHECK constraint) pero no tienen endpoints ni schemas
        específicos todavía en esta API.

    ProductoEstado:
      type: string
      enum: [activo, inactivo, agotado]

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Novela
        description:
          type: string
          example: Novelas literarias y contemporáneas
        productCount:
          type: integer
          description: Cantidad de productos asociados (vía producto_categoria)
          example: 42

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Novela
        description:
          type: string
          example: Novelas literarias y contemporáneas

    ProductImage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        imageUrl:
          type: string
          example: https://cdn.maxilibros.com/cien-anos-1.jpg
        orden:
          type: integer
          example: 0
        esPrincipal:
          type: boolean
          description: >
            Solo una imagen por producto puede tener esPrincipal=true
            (índice único parcial en la base de datos).
          example: true

    ProductImageInput:
      type: object
      required:
        - imageUrl
      properties:
        imageUrl:
          type: string
          example: https://cdn.maxilibros.com/cien-anos-2.jpg
        orden:
          type: integer
          minimum: 0
          default: 0
        esPrincipal:
          type: boolean
          default: false

    ProductCard:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Cien años de soledad
        tipoProducto:
          $ref: "#/components/schemas/TipoProducto"
        precio:
          type: number
          format: float
          example: 19.99
        descuento:
          type: number
          format: float
          example: 15
        precioFinal:
          type: number
          format: float
          readOnly: true
        imagenPrincipal:
          type: string
          nullable: true
          description: URL de la imagen con esPrincipal=true, o la de menor orden si ninguna está marcada.
          example: https://cdn.maxilibros.com/cien-anos-1.jpg
        stock:
          type: integer
          example: 25
        categories:
          type: array
          description: Todas las categorías asociadas (relación N:N)
          items:
            $ref: "#/components/schemas/Category"
        estado:
          $ref: "#/components/schemas/ProductoEstado"

    PagedProductCard:
      type: object
      properties:
        total:
          type: integer
          example: 152
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 8
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"

    Libro:
      type: object
      description: Datos específicos de la tabla libro, cuando tipoProducto='libro'.
      properties:
        isbn:
          type: string
          example: "9780307474728"
        autor:
          type: string
          example: Gabriel García Márquez
        editorial:
          type: string
          example: Sudamericana
        anioPublicacion:
          type: integer
          example: 1967

    ProductDetail:
      type: object
      properties:
        id:
          type: integer
          example: 1
        tipoProducto:
          $ref: "#/components/schemas/TipoProducto"
        nombre:
          type: string
          example: Cien años de soledad
        descripcion:
          type: string
          example: Novela cumbre del realismo mágico.
        precio:
          type: number
          format: float
          example: 19.99
        descuento:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 0
          description: Porcentaje de descuento sobre el precio. 0 significa sin descuento.
          example: 15
        precioFinal:
          type: number
          format: float
          readOnly: true
          description: Precio ya calculado con el descuento aplicado. Solo lectura, lo calcula el backend.
          example: 16.99
        stock:
          type: integer
          example: 25
        estado:
          $ref: "#/components/schemas/ProductoEstado"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        libro:
          allOf:
            - $ref: "#/components/schemas/Libro"
          nullable: true
          description: Presente solo si tipoProducto='libro'; null en caso contrario.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-01T12:00:00Z"

    ProductInput:
      type: object
      required:
        - tipoProducto
        - nombre
        - precio
        - categoryIds
      properties:
        tipoProducto:
          $ref: "#/components/schemas/TipoProducto"
        nombre:
          type: string
          example: Cien años de soledad
        descripcion:
          type: string
          example: Novela cumbre del realismo mágico.
        precio:
          type: number
          format: float
          minimum: 0
          example: 19.99
        descuento:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 0
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 25
        estado:
          $ref: "#/components/schemas/ProductoEstado"
        categoryIds:
          type: array
          description: Debe incluir al menos una categoría.
          minItems: 1
          items:
            type: integer
          example: [3, 5]
        images:
          type: array
          description: Opcional al crear; se pueden agregar después con POST /products/{id}/images.
          items:
            $ref: "#/components/schemas/ProductImageInput"
        libro:
          description: Obligatorio si tipoProducto='libro'; se ignora en otro caso.
          allOf:
            - type: object
              required:
                - isbn
              properties:
                isbn:
                  type: string
                  example: "9780307474728"
                autor:
                  type: string
                  example: Gabriel García Márquez
                editorial:
                  type: string
                  example: Sudamericana
                anioPublicacion:
                  type: integer
                  example: 1967

    ProductPatchInput:
      type: object
      description: Todos los campos son opcionales; solo se actualizan los enviados.
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          format: float
          minimum: 0
        stock:
          type: integer
          minimum: 0
        descuento:
          type: number
          format: float
          minimum: 0
          maximum: 100
        estado:
          $ref: "#/components/schemas/ProductoEstado"
        categoryIds:
          type: array
          description: Si se envía, reemplaza el set completo de categorías.
          items:
            type: integer

    ProductStatusUpdate:
      type: object
      required:
        - estado
      properties:
        estado:
          $ref: "#/components/schemas/ProductoEstado"
          example: agotado

    User:
      type: object
      description: >
        Nunca incluye password_hash. El backend debe excluir explícitamente
        esa columna en toda consulta (p. ej. en Sequelize, attributes:
        { exclude: ['passwordHash'] }), incluso en endpoints que solo
        exigen estar autenticado, sin importar el rol.
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        nombre:
          type: string
          example: Maxi
        apellido:
          type: string
          example: Gómez
        email:
          type: string
          format: email
          example: maxi@maxilibros.com
        telefono:
          type: string
          example: "1122334455"
        direccion:
          type: string
          nullable: true
          example: Av. Siempre Viva 742
        rol:
          type: string
          enum: [admin, cliente]
          example: cliente
        fechaRegistro:
          type: string
          format: date-time
          readOnly: true
          example: "2026-01-10T08:00:00Z"

    RegisterInput:
      type: object
      description: >
        El campo 'rol' NO forma parte de este input intencionalmente
        (protección contra mass assignment). El backend asigna 'cliente'
        de forma explícita en el INSERT, sin depender del valor DEFAULT
        de la columna en la base de datos (que está seteado en 'admin' —
        confiar en ese default sería un riesgo de seguridad). Crear un
        admin requiere un endpoint separado, protegido por rol admin,
        nunca una variante del registro público.
      required:
        - nombre
        - apellido
        - email
        - telefono
        - password
      properties:
        nombre:
          type: string
          example: Maxi
        apellido:
          type: string
          example: Gómez
        email:
          type: string
          format: email
          example: maxi@maxilibros.com
        telefono:
          type: string
          example: "1122334455"
        direccion:
          type: string
          nullable: true
          description: Opcional en el registro inicial.
          example: Av. Siempre Viva 742
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          example: S3gura!2026

    UserUpdateInput:
      type: object
      description: >
        Todos los campos son opcionales; solo se actualizan los enviados.
        No incluye 'rol' ni 'email' (cambiar el email requeriría un flujo
        de verificación aparte, no implementado).
      properties:
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        direccion:
          type: string
          nullable: true

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: maxi@maxilibros.com
        password:
          type: string
          format: password
          example: S3gura!2026

    ForgotPasswordInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: maxi@maxilibros.com

    ResetPasswordInput:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Token recibido por email en texto plano; el backend lo hashea para buscarlo en token_hash.
          example: 7f3a9c1e-4b2d-4e5f-8a6b-1c2d3e4f5a6b
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          example: NuevaS3gura!2026

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT para autenticar peticiones (header Authorization Bearer)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/User"

    RedSocial:
      type: object
      properties:
        id:
          type: integer
          example: 1
        tipo:
          type: string
          example: instagram
        url:
          type: string
          example: "https://instagram.com/maxilibros"

    Comercio:
      type: object
      description: Registro único (singleton) con la información institucional del comercio.
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Librería Maxilibros
        descripcion:
          type: string
          example: Librería de barrio especializada en literatura latinoamericana.
        direccion:
          type: string
          example: Av. Corrientes 1234, CABA
        telefono:
          type: string
          example: "1145678900"
        redesSociales:
          type: array
          items:
            $ref: "#/components/schemas/RedSocial"
        horarios:
          type: string
          description: Texto libre con los horarios de atención.
          example: "Lunes a viernes 9 a 19hs, sábados 9 a 13hs"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-01T12:00:00Z"

    ComercioInput:
      type: object
      required:
        - nombre
        - direccion
        - telefono
      properties:
        nombre:
          type: string
          example: Librería Maxilibros
        descripcion:
          type: string
          example: Librería de barrio especializada en literatura latinoamericana.
        direccion:
          type: string
          example: Av. Corrientes 1234, CABA
        telefono:
          type: string
          example: "1145678900"
        redesSociales:
          type: array
          description: Reemplaza completamente el set de redes sociales existente.
          items:
            type: object
            required:
              - tipo
              - url
            properties:
              tipo:
                type: string
                example: instagram
              url:
                type: string
                example: "https://instagram.com/maxilibros"
        horarios:
          type: string
          example: "Lunes a viernes 9 a 19hs, sábados 9 a 13hs"

    ConsultaStatus:
      type: string
      enum: [pendiente, Leída, Respondida]
      description:  "Estado de la consulta"
    ConsultaInput:
      type: object
      required:
        - nombre
        - email
        - asunto
        - mensaje
      properties:
        nombre:
          type: string
          example: Juan Pérez
        email:
          type: string
          format: email
          example: juan@example.com
        telefono:
          type: string
          description: Opcional según la consigna del TPO
          example: "1122334455"
        asunto:
          type: string
          example: Consulta por stock
        mensaje:
          type: string
          example: ¿Tienen disponible el producto en talle M?

    Consulta:
      type: object
      description: El campo 'estado' se setea siempre en 'pendiente' al crear la consulta; el backend lo ignora si viene en el body de creación.
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        asunto:
          type: string
        mensaje:
          type: string
        estado:
          $ref: "#/components/schemas/ConsultaStatus"
        fecha:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-10T14:30:00Z"

    ConsultaStatusUpdate:
      type: object
      required:
        - estado
      properties:
        estado:
          $ref: "#/components/schemas/ConsultaStatus"

    PagedConsulta:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Consulta"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer