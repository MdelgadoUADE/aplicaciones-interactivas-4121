openapi: 3.0.3
info:
  title: API de tienda de libros MaxiLibros
  description: API para la gestión de venta de libros
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Servidor principal

tags:
  - name: Identificadores
    description: Utilidades para obtener IDs de productos
  - name: Productos
    description: Gestión del catálogo de libros
  - name: Categorías
    description: Gestión de categorías
  - name: Autenticación
    description: Registro y login de usuarios
  - name: Comercio
    description: Información institucional del comercio
  - name: Consultas
    description: Formulario de contacto y gestión de consultas

paths:
  /products/get-ids:
    get:
      summary: Trae los IDs de productos disponibles, ordenados de menor a mayor
      description: >
        Endpoint de utilidad para sincronizar listas en el frontend sin
        descargar el catálogo completo.
      tags:
        - Identificadores
      parameters:
        - name: limit
          in: query
          required: false
          description: Límite de cuántos IDs traer. Por defecto trae 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: categoryId
          in: query
          required: false
          description: Filtra los IDs por categoría
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Cantidad de IDs a saltar (para paginar)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: IDs obtenidos correctamente (la lista puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
              example: [1, 2, 3]

  /products:
    get:
      summary: Obtener lista de productos (info básica para armar cards)
      description: >
        Sitio público sin token: devuelve solo productos con status=active,
        ignorando cualquier otro valor de 'status' recibido. Panel admin con
        token válido y rol admin: respeta el filtro 'status' tal como se
        envía (incluyendo la posibilidad de ver 'inactive').
        El servidor decide esto según la autenticación, nunca según lo que
        el cliente declare — ver nota de seguridad en el schema ProductCard.
      tags:
        - Productos
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: categoryId
          in: query
          required: false
          description: Filtrar por categoría
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: Buscar por título o autor
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: inStock
          in: query
          required: false
          description: Solo productos con stock disponible
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          description: >
            Filtra por estado. Si el solicitante no está autenticado como
            admin, el servidor ignora cualquier valor distinto de 'active'
            y fuerza ese filtro.
          schema:
            type: string
            enum: [active, inactive]
        - name: onSale
          in: query
          required: false
          description: Si es true, devuelve solo productos con discountPercentage > 0
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [price_asc, price_desc, title_asc, newest]
            default: newest
      responses:
        "200":
          description: Lista paginada de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductCard"
    post:
      summary: Crear un nuevo producto (libro)
      description: Requiere rol admin. El ISBN debe ser único.
      tags:
        - Productos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe un producto con ese ISBN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products/{id}:
    get:
      summary: Obtener el detalle completo de un producto
      description: >
        Si el producto tiene status=inactive y quien solicita no es admin
        autenticado, el servidor debe responder 404 (no filtrar su existencia).
      security:
        - bearerAuth: []
        - {}
      tags:
        - Productos
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Reemplazar completamente un producto
      description: Requiere rol admin. Todos los campos del input son obligatorios.
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Actualizar campos específicos de un producto
      description: >
        Requiere rol admin. Útil para cambiar solo el stock o el precio
        sin enviar el objeto completo.
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatchInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Eliminar un producto
      description: Requiere rol admin.
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "204":
          description: Producto eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/status:
    patch:
      summary: Activar o desactivar un producto
      description: >
        Requiere rol admin. Cambia la visibilidad de la publicación sin
        modificar el resto de los datos. Operación independiente del PATCH
        genérico para que quede como una acción explícita y auditable.
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductStatusUpdate"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      summary: Obtener lista de categorías
      tags:
        - Categorías
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      summary: Crear una categoría
      description: Requiere rol admin. El nombre debe ser único.
      tags:
        - Categorías
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe una categoría con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}:
    get:
      summary: Obtener una categoría
      tags:
        - Categorías
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      responses:
        "200":
          description: Detalle de la categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar una categoría
      description: Requiere rol admin.
      tags:
        - Categorías
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Eliminar una categoría
      description: Requiere rol admin. Falla si tiene productos asociados.
      tags:
        - Categorías
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      responses:
        "204":
          description: Categoría eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La categoría tiene productos asociados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}/products:
    get:
      summary: Obtener los productos de una categoría
      tags:
        - Categorías
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Lista paginada de productos de la categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductCard"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/register:
    post:
      summary: Registrar un nuevo usuario
      description: >
        No se permiten emails duplicados. El rol se asigna siempre como
        'customer' en el backend; este input no acepta 'role' del cliente
        (ver nota de seguridad en RegisterInput sobre mass assignment).
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Usuario registrado. Devuelve token y datos del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Iniciar sesión
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: Cerrar sesión
      description: Invalida el token actual.
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      summary: Solicitar recuperación de contraseña
      description: >
        Público. Envía un email con un link/token para restablecer la
        contraseña si el email existe. Por seguridad, responde 200 aunque
        el email no exista, para no filtrar qué correos están registrados.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: >
            Si el email existe, se envió un correo con instrucciones.
            La respuesta es la misma exista o no la cuenta.
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/reset-password:
    post:
      summary: Restablecer la contraseña usando el token recibido por email
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Contraseña actualizada correctamente
        "400":
          description: Token inválido, expirado, o contraseña que no cumple los requisitos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      summary: Obtener el perfil del usuario autenticado
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos del usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Modificar los datos personales del usuario autenticado
      description: >
        El usuario a modificar es siempre el que surge del token (id del
        JWT verificado), nunca un id recibido en el body o en la URL. No
        existe un endpoint para que un usuario modifique a otro por id
        (evita IDOR / Broken Object Level Authorization).
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Datos actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /comercio:
    get:
      summary: Obtener la información institucional del comercio
      description: >
        Público. Devuelve un único registro (singleton): el comercio
        asociado a esta instancia de la aplicación.
      tags:
        - Comercio
      responses:
        "200":
          description: Información del comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comercio"
        "404":
          description: Todavía no se cargó la información del comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Crear o actualizar la información institucional del comercio
      description: Requiere rol admin. Al ser un singleton, PUT crea el registro si no existe o lo reemplaza si ya existe.
      tags:
        - Comercio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComercioInput"
      responses:
        "200":
          description: Información del comercio actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comercio"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /consultas:
    post:
      summary: Enviar una consulta desde el formulario de contacto
      description: Endpoint público, no requiere autenticación. Cualquier visitante puede enviar una consulta.
      tags:
        - Consultas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaInput"
      responses:
        "201":
          description: Consulta creada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "400":
          $ref: "#/components/responses/ValidationError"

    get:
      summary: Listar consultas recibidas
      description: Solo admin. Permite filtrar por estado.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConsultaStatus"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Lista paginada de consultas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedConsulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /consultas/{id}:
    get:
      summary: Obtener el detalle de una consulta
      description: Solo admin.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      responses:
        "200":
          description: Detalle de la consulta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Eliminar una consulta
      description: Solo admin.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      responses:
        "204":
          description: Consulta eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /consultas/{id}/estado:
    patch:
      summary: Cambiar el estado de una consulta
      description: Solo admin. Permite marcar como pendiente, leída o respondida.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaStatusUpdate"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Header Authorization: Bearer <token>. El middleware debe validar
        el token y, en cada rama (sin token, token inválido, token expirado),
        cortar la ejecución con 'return' antes de llamar a next() — un
        return faltante deja el request en un estado inconsistente.

  parameters:
    PathProductId:
      name: id
      in: path
      required: true
      description: ID del producto
      schema:
        type: integer
        minimum: 1
    PathCategoryId:
      name: id
      in: path
      required: true
      description: ID de la categoría
      schema:
        type: integer
        minimum: 1
    PathConsultaId:
      name: id
      in: path
      required: true
      description: ID de la consulta
      schema:
        type: integer
      example: 1
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Recurso no encontrado
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: El campo price debe ser mayor a 0
    Unauthorized:
      description: No autenticado (token ausente, inválido o expirado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Token inválido o expirado
    Forbidden:
      description: No tienes permisos para esta operación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Se requiere rol admin

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Mensaje descriptivo del error

    ProductCard:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Cien años de soledad
        author:
          type: string
          example: Gabriel García Márquez
        price:
          type: number
          format: float
          example: 19.99
        discountPercentage:
          type: number
          format: float
          example: 15
        finalPrice:
          type: number
          format: float
          readOnly: true
        imageUrl:
          type: string
          example: https://cdn.maxilibros.com/cien-anos.jpg
        stock:
          type: integer
          example: 25
        categoryId:
          type: integer
          example: 3
        categoryName:
          type: string
          example: Novela
        status:
          type: string
          enum: [active, inactive]
          default: active
          description: Indica si la publicación está visible/disponible en el sitio público
          example: active

    PagedProductCard:
      type: object
      properties:
        total:
          type: integer
          example: 152
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 8
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"

    ProductDetail:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Cien años de soledad
        author:
          type: string
          example: Gabriel García Márquez
        editorial:
          type: string
          example: Sudamericana
        isbn:
          type: string
          example: "9780307474728"
        description:
          type: string
          example: Novela cumbre del realismo mágico.
        price:
          type: number
          format: float
          example: 19.99
        discountPercentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 0
          description: Porcentaje de descuento aplicado sobre el precio. 0 significa sin descuento.
          example: 15
        finalPrice:
          type: number
          format: float
          readOnly: true
          description: Precio ya calculado con el descuento aplicado. Solo lectura, lo calcula el backend.
          example: 22.09
        stock:
          type: integer
          example: 25
        categoryId:
          type: integer
          example: 3
        categoryName:
          type: string
          example: Novela
        imageUrl:
          type: string
          example: https://cdn.maxilibros.com/cien-anos.jpg
        publishedYear:
          type: integer
          example: 1967
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-01-15T10:30:00Z"
        status:
          type: string
          enum: [active, inactive]
          default: active
          description: Indica si la publicación está visible/disponible en el sitio público
          example: active

