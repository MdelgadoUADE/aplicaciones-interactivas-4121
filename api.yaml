openapi: 3.0.3
info:
  title: API de tienda de libros MaxiLibros
  description: >
    API para la gestión de venta de libros. Alineada al DER con
    producto_categoria (N:N), producto_imagen (múltiples imágenes) y
    estados en español.
  version: 2.2.0

servers:
  - url: http://localhost:3000/api
    description: Servidor principal

tags:
  - name: Productos
    description: Gestión del catálogo de productos
  - name: Categorías
    description: Gestión de categorías
  - name: Autenticación
    description: Registro y login de usuarios
  - name: Comercio
    description: Información institucional del comercio
  - name: Consultas
    description: Formulario de contacto y gestión de consultas
  - name: Dashboard
    description: Métricas y estadísticas del comercio (admin-only)

paths:
  /products:
    get:
      summary: Obtener lista de productos (info básica para armar cards)
      description: >
        Sitio público sin token: devuelve solo productos con estado=activo,
        ignorando cualquier otro valor de 'estado' recibido. Panel admin con
        token válido y rol admin: respeta el filtro 'estado' tal como se
        envía (incluyendo la posibilidad de ver 'inactivo' o 'agotado').
      tags:
        - Productos
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: inStock
          in: query
          required: false
          schema:
            type: boolean
        - name: estado
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductoEstado"
        - name: tipoProducto
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TipoProducto"
        - name: onSale
          in: query
          required: false
          schema:
            type: boolean
        - name: destacado
          in: query
          required: false
          schema:
            type: boolean
        - name: novedades
          in: query
          required: false
          description: >
            Si es true, devuelve solo productos creados en los últimos 7
            días (según producto.created_at).
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [price_asc, price_desc, title_asc, newest]
            default: newest
      responses:
        "200":
          description: Lista paginada de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductCard"
    post:
      summary: Crear un nuevo producto
      tags:
        - Productos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe un producto con ese ISBN (si tipoProducto=libro)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products/{id}:
    get:
      summary: Obtener el detalle completo de un producto
      description: >
        Sitio público sin token, o panel admin con token: en ambos casos
        devuelve el detalle. Efecto secundario (Etapa 16): si quien pide
        NO es admin, incrementa en 1 producto.visitas — las visitas del
        propio admin revisando su panel no cuentan como interés real de
        un visitante y no suman.
      security:
        - bearerAuth: []
        - {}
      tags:
        - Productos
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Reemplazar completamente un producto
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Actualizar campos específicos de un producto
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatchInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Eliminar un producto
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "204":
          description: Producto eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/status:
    patch:
      summary: Activar, desactivar o marcar como agotado un producto
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductStatusUpdate"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/destacado:
    patch:
      summary: Marcar o desmarcar un producto como destacado
      description: >
        Requiere rol admin. Marca o desmarca un producto como destacado. 
        Al marcar (destacado=true), si ya hay 6 productos destacados, 
        rechaza con 409 — el admin tiene que desmarcar uno manualmente 
        antes de agregar otro.
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDestacadoUpdate"
      responses:
        "200":
          description: Destacado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Ya hay 6 productos destacados (el máximo permitido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products/{id}/images:
    get:
      summary: Listar las imágenes de un producto
      tags:
        - Productos
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "200":
          description: Imágenes del producto, ordenadas por el campo orden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductImage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Agregar una imagen a un producto
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageInput"
      responses:
        "201":
          description: Imagen agregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/{id}/images/{imageId}:
    delete:
      summary: Eliminar una imagen de un producto
      tags:
        - Productos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Imagen eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      summary: Obtener lista de categorías
      tags:
        - Categorías
      responses:
        "200":
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      summary: Crear una categoría
      tags:
        - Categorías
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe una categoría con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}:
    get:
      summary: Obtener una categoría
      tags:
        - Categorías
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      responses:
        "200":
          description: Detalle de la categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar una categoría
      tags:
        - Categorías
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Eliminar una categoría
      description: >
        Requiere rol admin. Falla si algún producto quedaría sin ninguna
        categoría como resultado (regla de negocio: todo producto debe
        tener al menos una categoría).
      tags:
        - Categorías
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
      responses:
        "204":
          description: Categoría eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Al menos un producto quedaría sin categorías si se elimina esta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /categories/{id}/products:
    get:
      summary: Obtener los productos de una categoría
      tags:
        - Categorías
      parameters:
        - $ref: "#/components/parameters/PathCategoryId"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Lista paginada de productos de la categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductCard"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/register:
    post:
      summary: Registrar un nuevo usuario administrador
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Usuario registrado. Devuelve token y datos del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: Código de invitación inválido o ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Iniciar sesión
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          description: Cuenta bloqueada temporalmente por intentos fallidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: Cerrar sesión
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      summary: Solicitar recuperación de contraseña
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: >
            Si el email existe, se envió un correo con instrucciones.
            La respuesta es la misma exista o no la cuenta.
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/reset-password:
    post:
      summary: Restablecer la contraseña usando el token recibido por email
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Contraseña actualizada correctamente
        "400":
          description: >
            Token inválido, ya usado, expirado, o contraseña que no
            cumple los requisitos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      summary: Obtener el perfil del usuario autenticado
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos del usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Modificar los datos personales del usuario autenticado
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Datos actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /comercio:
    get:
      summary: Obtener la información institucional del comercio
      tags:
        - Comercio
      responses:
        "200":
          description: Información del comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comercio"
        "404":
          description: Todavía no se cargó la información del comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Crear o actualizar la información institucional del comercio
      tags:
        - Comercio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComercioInput"
      responses:
        "200":
          description: Información del comercio actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comercio"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /consultas:
    post:
      summary: Enviar una consulta desde el formulario de contacto
      description: Endpoint público, no requiere autenticación. Cualquier visitante puede enviar una consulta.
      tags:
        - Consultas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaInput"
      responses:
        "201":
          description: Consulta creada correctamente, con estado='pendiente'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "400":
          $ref: "#/components/responses/ValidationError"
    get:
      summary: Listar consultas recibidas
      description: Solo admin. Permite filtrar por estado.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConsultaStatus"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Lista paginada de consultas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedConsulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /consultas/{id}:
    get:
      summary: Obtener el detalle de una consulta
      description: Solo admin.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      responses:
        "200":
          description: Detalle de la consulta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Eliminar una consulta
      description: Solo admin.
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      responses:
        "204":
          description: Consulta eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /consultas/{id}/estado:
    patch:
      summary: Cambiar el estado de una consulta
      description: >
        Solo admin. Estados posibles: pendiente, leida, respondida
      tags:
        - Consultas
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathConsultaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaStatusUpdate"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /dashboard/metricas:
    get:
      summary: Obtener métricas y estadísticas del comercio
      description: >
        Admin-only. No depende de lógica de compras (fuera de scope del
        TPO): son estadísticas sobre el catálogo, las consultas y las
        vistas de producto. umbralStockBajo es configurable; si no se
        envía, el backend usa 5 por defecto.
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: umbralStockBajo
          in: query
          required: false
          description: >
            Un producto activo con stock menor a este valor se cuenta
            como "stock bajo".
          schema:
            type: integer
            minimum: 0
            default: 5
      responses:
        "200":
          description: Métricas del comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetricas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathProductId:
      name: id
      in: path
      required: true
      description: ID del producto
      schema:
        type: integer
    PathCategoryId:
      name: id
      in: path
      required: true
      description: ID de la categoría
      schema:
        type: integer
    PathConsultaId:
      name: id
      in: path
      required: true
      description: ID de la consulta
      schema:
        type: integer
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No autenticado (token ausente, inválido, expirado o revocado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: No tienes permisos para esta operación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    TipoProducto:
      type: string
      enum: [libro, papeleria, accesorio, otros]

    ProductoEstado:
      type: string
      enum: [activo, inactivo, agotado]

    Category:
      type: object
      properties:
        idCategoria:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        productCount:
          type: integer

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    ProductImage:
      type: object
      properties:
        idImagen:
          type: integer
        idProducto:
          type: integer
        imagenUrl:
          type: string
        orden:
          type: integer
        esPrincipal:
          type: boolean

    ProductImageInput:
      type: object
      required:
        - imageUrl
      properties:
        imageUrl:
          type: string
        orden:
          type: integer
          minimum: 0
        esPrincipal:
          type: boolean

    ProductCard:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        tipoProducto:
          $ref: "#/components/schemas/TipoProducto"
        precio:
          type: number
        descuento:
          type: number
        precioFinal:
          type: number
          readOnly: true
        imagenPrincipal:
          type: string
          nullable: true
        stock:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        destacado:
          type: boolean
        estado:
          $ref: "#/components/schemas/ProductoEstado"

    PagedProductCard:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"

    Libro:
      type: object
      properties:
        isbn:
          type: string
        autor:
          type: string
          nullable: true
        editorial:
          type: string
          nullable: true
        anioPublicacion:
          type: integer
          nullable: true

    ProductDetail:
      type: object
      properties:
        idProducto:
          type: integer
        tipoProducto:
          $ref: "#/components/schemas/TipoProducto"
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        precio:
          type: number
        descuento:
          type: number
        destacado:
          type: boolean
        estado:
          $ref: "#/components/schemas/ProductoEstado"
        stock:
          type: integer
        visitas:
          type: integer
          readOnly: true
          description: >
            Contador de vistas (Etapa 16). Se incrementa en cada GET de
            este producto hecho por un visitante sin token admin.
        updatedAt:
          type: string
          format: date-time
        categorias:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        imagenes:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        libro:
          allOf:
            - $ref: "#/components/schemas/Libro"
          nullable: true
        precioFinal:
          type: number
          readOnly: true

    ProductInput:
      type: object
      required:
        - tipoProducto
        - nombre
        - precio
        - categoryIds
      properties:
        tipoProducto:
          $ref: "#/components/schemas/TipoProducto"
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          minimum: 0
        descuento:
          type: number
          minimum: 0
          maximum: 100
        stock:
          type: integer
          minimum: 0
        estado:
          $ref: "#/components/schemas/ProductoEstado"
        categoryIds:
          type: array
          minItems: 1
          items:
            type: integer
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageInput"
        libro:
          allOf:
            - type: object
              required:
                - isbn
              properties:
                isbn:
                  type: string
                autor:
                  type: string
                editorial:
                  type: string
                anioPublicacion:
                  type: integer

    ProductPatchInput:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          minimum: 0
        stock:
          type: integer
          minimum: 0
        descuento:
          type: number
          minimum: 0
          maximum: 100
        estado:
          $ref: "#/components/schemas/ProductoEstado"
        categoryIds:
          type: array
          items:
            type: integer

    ProductStatusUpdate:
      type: object
      required:
        - estado
      properties:
        estado:
          $ref: "#/components/schemas/ProductoEstado"

    ProductDestacadoUpdate:
      type: object
      required:
        - destacado
      properties:
        destacado:
          type: boolean

    User:
      type: object
      properties:
        idUsuario:
          type: string
          format: uuid
        nombre:
          type: string
        apellido:
          type: string
          nullable: true
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        rol:
          type: string
          enum: [admin]
        direccion:
          type: string
          nullable: true
        fechaRegistro:
          type: string
          format: date-time
          readOnly: true

    RegisterInput:
      type: object
      required:
        - nombre
        - apellido
        - email
        - telefono
        - password
        - inviteCode
      properties:
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
        direccion:
          type: string
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
        inviteCode:
          type: string

    UserUpdateInput:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        direccion:
          type: string
          nullable: true

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    ForgotPasswordInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          minLength: 8

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    RedSocial:
      type: object
      properties:
        idRedSocial:
          type: integer
        tipo:
          type: string
        url:
          type: string

    Comercio:
      type: object
      properties:
        idComercio:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        horarios:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        redesSociales:
          type: array
          items:
            $ref: "#/components/schemas/RedSocial"

    ComercioInput:
      type: object
      required:
        - nombre
        - direccion
        - telefono
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        direccion:
          type: string
        telefono:
          type: string
        horarios:
          type: string
        redesSociales:
          type: array
          items:
            type: object
            required:
              - tipo
              - url
            properties:
              tipo:
                type: string
              url:
                type: string

    ConsultaStatus:
      type: string
      enum: [pendiente, leida, respondida]

    ConsultaInput:
      type: object
      required:
        - nombre
        - email
        - asunto
        - mensaje
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        asunto:
          type: string
        mensaje:
          type: string

    Consulta:
      type: object
      properties:
        idConsulta:
          type: integer
        nombre:
          type: string
        email:
          type: string
        telefono:
          type: string
          nullable: true
        asunto:
          type: string
        mensaje:
          type: string
        estado:
          $ref: "#/components/schemas/ConsultaStatus"
        fecha:
          type: string
          format: date-time
          readOnly: true

    ConsultaStatusUpdate:
      type: object
      required:
        - estado
      properties:
        estado:
          $ref: "#/components/schemas/ConsultaStatus"

    PagedConsulta:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Consulta"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    DashboardMetricas:
      type: object
      description: Respuesta de GET /dashboard/metricas (Etapa 16).
      properties:
        totales:
          type: object
          properties:
            productos:
              type: integer
            categorias:
              type: integer
            consultas:
              type: integer
        productosPorEstado:
          type: object
          description: >
            Mapa estado -> cantidad, ej. activo 21, inactivo 1, agotado 3.
          additionalProperties:
            type: integer
        consultasPorEstado:
          type: object
          description: >
            Mapa estado -> cantidad, ej. pendiente 5, leida 1, respondida 1.
          additionalProperties:
            type: integer
        productosStockBajo:
          type: object
          properties:
            umbral:
              type: integer
            cantidad:
              type: integer
        distribucionPorCategoria:
          type: array
          items:
            type: object
            properties:
              idCategoria:
                type: integer
              nombre:
                type: string
              cantidadProductos:
                type: integer
        precioPromedio:
          type: object
          properties:
            general:
              type: number
            porCategoria:
              type: array
              items:
                type: object
                properties:
                  idCategoria:
                    type: integer
                  nombre:
                    type: string
                  precioPromedio:
                    type: number
        consultasRecientes:
          type: object
          properties:
            ultimos7Dias:
              type: integer
            ultimos30Dias:
              type: integer
        productosConDescuento:
          type: integer
        productosDestacados:
          type: object
          properties:
            cantidad:
              type: integer
            maximo:
              type: integer
              description: Tope fijo de productos destacados simultáneos (Etapa 13).
        productoMasVisitado:
          nullable: true
          description: >
            null si todavía no hay ninguna vista registrada en el
            catálogo (producto.visitas=0 en todas las filas).
          allOf:
            - type: object
              properties:
                id:
                  type: integer
                nombre:
                  type: string
                visitas:
                  type: integer