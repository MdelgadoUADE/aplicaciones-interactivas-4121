          example: 42

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Novela
        description:
          type: string
          example: Novelas literarias y contemporáneas

    User:
      type: object
      description: >
        Nunca incluye el hash de la contraseña. El backend debe excluir
        explícitamente esa columna en toda consulta (p. ej. en Sequelize,
        attributes: { exclude: ['passwordHash'] }), incluso en endpoints
        que solo exigen estar autenticado, sin importar el rol.
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        nombre:
          type: string
          example: Maxi
        apellido:
          type: string
          example: Gómez
        email:
          type: string
          format: email
          example: maxi@maxilibros.com
        telefono:
          type: string
          example: "1122334455"
        direccion:
          type: string
          nullable: true
          example: Av. Siempre Viva 742
        rol:
          type: string
          enum: [customer, admin]
          example: customer
        fechaRegistro:
          type: string
          format: date-time
          readOnly: true
          example: "2026-01-10T08:00:00Z"

    RegisterInput:
      type: object
      description: >
        El campo 'rol' NO forma parte de este input intencionalmente
        (protección contra mass assignment). El backend asigna 'customer'
        por defecto sin importar qué envíe el cliente en el body; crear un
        admin requiere un endpoint separado, protegido por rol admin, nunca
        una variante del registro público.
      required:
        - nombre
        - apellido
        - email
        - telefono
        - password
      properties:
        nombre:
          type: string
          example: Maxi
        apellido:
          type: string
          example: Gómez
        email:
          type: string
          format: email
          example: maxi@maxilibros.com
        telefono:
          type: string
          example: "1122334455"
        direccion:
          type: string
          nullable: true
          description: Opcional en el registro inicial.
          example: Av. Siempre Viva 742
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          example: S3gura!2026

    UserUpdateInput:
      type: object
      description: Todos los campos son opcionales; solo se actualizan los enviados. No incluye 'rol' ni 'email' (cambiar el email requiere un flujo de verificación aparte).
      properties:
        nombre:
          type: string
        apellido:
          type: string
        telefono:
          type: string
        direccion:
          type: string
          nullable: true

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: maxi@maxilibros.com
        password:
          type: string
          format: password
          example: S3gura!2026

    ForgotPasswordInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: maxi@maxilibros.com

    ResetPasswordInput:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Token recibido por email, de un solo uso y con expiración corta.
          example: 7f3a9c1e-4b2d-4e5f-8a6b-1c2d3e4f5a6b
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          example: NuevaS3gura!2026

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT para autenticar peticiones (header Authorization Bearer)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/User"

    Comercio:
      type: object
      description: Registro único (singleton) con la información institucional del comercio.
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Librería Maxilibros
        descripcion:
          type: string
          example: Librería de barrio especializada en literatura latinoamericana.
        direccion:
          type: string
          example: Av. Corrientes 1234, CABA
        telefono:
          type: string
          example: "1145678900"
        redesSociales:
          type: object
          description: Pares clave-valor de red social y URL.
          additionalProperties:
            type: string
          example:
            instagram: "https://instagram.com/maxilibros"
            facebook: "https://facebook.com/maxilibros"
        horarios:
          type: string
          description: Texto libre con los horarios de atención.
          example: "Lunes a viernes 9 a 19hs, sábados 9 a 13hs"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: "2026-09-01T12:00:00Z"

    ComercioInput:
      type: object
      required:
        - nombre
        - direccion
        - telefono
      properties:
        nombre:
          type: string
          example: Librería Maxilibros
        descripcion:
          type: string
          example: Librería de barrio especializada en literatura latinoamericana.
        direccion:
          type: string
          example: Av. Corrientes 1234, CABA
        telefono:
          type: string
          example: "1145678900"
        redesSociales:
          type: object
          additionalProperties:
            type: string
          example:
            instagram: "https://instagram.com/maxilibros"
        horarios:
          type: string
          example: "Lunes a viernes 9 a 19hs, sábados 9 a 13hs"

